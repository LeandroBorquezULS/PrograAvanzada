# Configuración compartida por master, workers y driver.
# Lo que se deja aquí es lo que NO queremos que cada alumno tenga que recordar.
# Los parámetros que sí son objeto de estudio (particiones de shuffle, broadcast,
# skew) se fijan explícitamente en el notebook para que se vean y se puedan variar.

# --- Adaptive Query Execution -------------------------------------------------
# AQE re-planifica la consulta en tiempo de ejecución con las estadísticas reales
# de cada etapa. Es la defensa de primera línea contra el shuffling mal dimensionado:
# fusiona particiones diminutas y parte las gigantes.
spark.sql.adaptive.enabled                        true
spark.sql.adaptive.coalescePartitions.enabled     true
spark.sql.adaptive.skewJoin.enabled               true

# --- Registro de eventos ------------------------------------------------------
# Permite revisar la ejecución DESPUÉS de que el notebook cerró la sesión, con el
# History Server. Sin esto, la UI del driver (puerto 4040) muere con la sesión y se
# pierde toda la evidencia de cuántas tareas y cuánto shuffle hubo.
spark.eventLog.enabled                            true
spark.eventLog.dir                                file:/tmp/spark-events
spark.history.fs.logDirectory                     file:/tmp/spark-events

# --- Serialización ------------------------------------------------------------
# Kryo es bastante más compacto que el serializador por defecto de Java, y en un
# shuffle lo que se serializa es exactamente lo que viaja por la red.
spark.serializer                                  org.apache.spark.serializer.KryoSerializer

# --- Parquet ------------------------------------------------------------------
# Spark 3 escribe timestamps en micros; esto mantiene compatibilidad al leer
# ficheros escritos por pandas/pyarrow en la Fase 1.
spark.sql.parquet.int96RebaseModeInRead           CORRECTED
spark.sql.parquet.int96RebaseModeInWrite          CORRECTED
spark.sql.parquet.datetimeRebaseModeInRead        CORRECTED
spark.sql.parquet.datetimeRebaseModeInWrite       CORRECTED

# --- Interfaz -----------------------------------------------------------------
spark.ui.showConsoleProgress                      true
